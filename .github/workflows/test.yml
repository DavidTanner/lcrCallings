name: Test

on:
  pull_request:
  # Lets the deploy workflow run the same checks before publishing
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run pages:build
