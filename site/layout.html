<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="{{description}}">
  <title>{{title}}</title>
  <link rel="icon" href="/icon-128.png">
  <link rel="apple-touch-icon" href="/icon-128.png">
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f4f6f8;
      --text: #1f2328;
      --muted: #59636e;
      --border: #d8dee4;
      --accent: #1c6fb8;
      --accent-text: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181c;
        --surface: #1f2329;
        --text: #e6e8eb;
        --muted: #9aa4af;
        --border: #343a42;
        --accent: #5aa5e8;
        --accent-text: #0b1520;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    a { color: var(--accent); }
    .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
    header { border-bottom: 1px solid var(--border); }
    header .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; padding-block: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; color: inherit; font-weight: 700; font-size: 18px; text-decoration: none; }
    nav { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 15px; }
    nav a { color: var(--muted); text-decoration: none; }
    nav a:hover { color: var(--text); text-decoration: underline; }
    main { padding-block: 32px 48px; }
    h1 { font-size: 34px; line-height: 1.2; margin: 0 0 16px; }
    h2 { font-size: 23px; line-height: 1.3; margin: 40px 0 12px; }
    h3 { font-size: 19px; margin: 28px 0 8px; }
    code { font-size: .9em; background: var(--surface); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
    li + li { margin-top: 6px; }
    .hero { text-align: center; padding-block: 16px 8px; }
    .hero img { border-radius: 20px; }
    .lede { font-size: 20px; color: var(--muted); margin: 0 auto 24px; max-width: 620px; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    .button { display: inline-block; padding: 10px 20px; border-radius: 8px; background: var(--accent); color: var(--accent-text); font-weight: 600; text-decoration: none; }
    .button.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .note { margin-top: 40px; padding: 16px 20px; border-radius: 8px; background: var(--surface); color: var(--muted); font-size: 15px; }
    .note p { margin: 0; }
    footer { border-top: 1px solid var(--border); color: var(--muted); font-size: 14px; }
    footer .wrap { padding-block: 20px 32px; }
    footer nav { margin-bottom: 8px; }
    footer p { margin: 0; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="brand" href="/"><img src="/icon-128.png" alt="" width="32" height="32">{{appName}}</a>
      <nav aria-label="Site">
        <a href="/app/">Web app</a>
        <a href="/demo/">Demo</a>
        <a href="/privacy/">Privacy Policy</a>
        <a href="/terms/">Terms of Service</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
{{content}}
  </main>
  <footer>
    <div class="wrap">
      <nav aria-label="Legal">
        <a href="/">About {{appName}}</a>
        <a href="/privacy/">Privacy Policy</a>
        <a href="/terms/">Terms of Service</a>
        <a href="/disclaimer/">Disclaimer</a>
        <a href="https://github.com/DavidTanner/lcrCallings">Source code</a>
      </nav>
      <p>{{appName}} is an independent project. It is not made, endorsed or supported by The Church of Jesus Christ of Latter-day Saints.</p>
    </div>
  </footer>
</body>
</html>
