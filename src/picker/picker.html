<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a Google Sheet</title>
  <!-- No color-scheme here: one different from LCR's would make the frame opaque -->
  <style>
    html, body { margin: 0; height: 100%; background: transparent; }
    body { font: 14px/1.4 system-ui, sans-serif; }
    #backdrop { position: fixed; inset: 0; display: grid; place-items: center; background: rgb(0 0 0 / 40%); }
    #card { display: flex; gap: 16px; align-items: center; padding: 16px 20px; border-radius: 8px; background: #fff; color: #222; box-shadow: 0 4px 24px rgb(0 0 0 / 25%); }
    button { font: inherit; padding: 4px 12px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; }
    /* hidden until the picker is up, so it doesn't cover Cancel */
    #pick { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; visibility: hidden; }
    .shown #backdrop { display: none; }
    .shown #pick { visibility: visible; }
  </style>
</head>
<body>
  <div id="backdrop">
    <div id="card">
      <span>Opening Google's file picker…</span>
      <button id="cancel" type="button">Cancel</button>
    </div>
  </div>
  <script src="picker.js"></script>
</body>
</html>
